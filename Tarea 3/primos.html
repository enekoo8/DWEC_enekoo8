
<!DOCTYPE html>
<html>
<body>

<h1>Numeros primos</h1>

<input type="number" id="numero" placeholder="Escribe un numero">
<button onclick="calcular()">Calcular</button>

<script>
function calcular() {
    let numero = parseInt(document.getElementById("numero").value);
    let resultado = "";

    for (let i = 1; i <= numero; i++) {
        let primo = true;

        if (i == 1) {
            primo = true;         
        } else {
            for (let j = 2; j < i; j++) {
                if (i % j == 0) {
                    primo = false;   
                }
            }
        }

        if (primo) {
            resultado = resultado + "<td>" + i + "</td>";
        }
    }

    document.getElementById("tabla").innerHTML = resultado;
}
</script>

<table border="1">
    <tr id="tabla"></tr>
</table>
</body>
</html>
